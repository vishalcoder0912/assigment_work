version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bambral-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bambral
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bambral-backend
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/bambral?schema=public"
      PORT: 4000
      NODE_ENV: development
      FRONTEND_URL: "http://localhost:5173"
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production-min-32-chars"
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run dev"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bambral-frontend
    environment:
      VITE_API_URL: "http://localhost:4000/api"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      - backend

volumes:
  postgres_data:
